name: Verify desktop editor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-and-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path crates/story-store/Cargo.toml
      - run: cargo test --locked --manifest-path crates/github-sync/Cargo.toml
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Exercise clipboard and encyclopedia actions in Microsoft Edge on Windows
        shell: pwsh
        run: |
          $env:CHROMIUM_PATH = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:PYTHONUTF8 = '1'
          node scripts/smoke.mjs tests/clipboard_smoke.py tests/investigation_cards_smoke.py tests/encyclopedia_smoke.py
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path crates/story-store/Cargo.toml
      - run: cargo test --locked --manifest-path crates/github-sync/Cargo.toml
