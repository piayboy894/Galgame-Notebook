name: Publish Windows release
on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md, scripts/release-notes.mjs, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$published" = "false" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Version $version is already published; no assets will be replaced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
  windows:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read this version's release notes
        id: notes
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { releaseNotes } from './scripts/release-notes.mjs';
          const version = JSON.parse(fs.readFileSync('package.json','utf8')).version;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<XUXIAN_RELEASE_NOTES\n'+releaseNotes(version)+'\nXUXIAN_RELEASE_NOTES\n');
          JS
      - run: npm test
      - run: cargo test --locked --manifest-path crates/story-store/Cargo.toml
      - name: Check release signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add TAURI_SIGNING_PRIVATE_KEY to repository Actions secrets before publishing."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 叙线 v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
