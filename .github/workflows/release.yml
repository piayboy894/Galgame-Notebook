name: Publish Windows and Android release
on:
  push:
    branches: [main]
    paths:
      [
        package.json,
        CHANGELOG.md,
        scripts/release-notes.mjs,
        .github/workflows/release.yml,
      ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: multiplatform-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$published" = "false" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Version $version is already published; no assets will be replaced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            if [ -z "$published" ]; then
              gh release create "v$version" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "叙线 v$version" --notes "正在构建 Windows 与 Android 安装包。"
            fi
          fi
  windows:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read this version's release notes
        id: notes
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { releaseNotes } from './scripts/release-notes.mjs';
          const version = JSON.parse(fs.readFileSync('package.json','utf8')).version;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<XUXIAN_RELEASE_NOTES\n'+releaseNotes(version)+'\nXUXIAN_RELEASE_NOTES\n');
          JS
      - run: npm test
      - run: cargo test --locked --manifest-path crates/story-store/Cargo.toml
      - run: cargo test --locked --manifest-path crates/github-sync/Cargo.toml
      - name: Check release signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add TAURI_SIGNING_PRIVATE_KEY to repository Actions secrets before publishing."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 叙线 v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
  android:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prepare stable Android signing identity
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/android-signing.mjs prepare
      - run: npm run android:build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - name: Verify APK and create signed Android update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/android-release.mjs
      - name: Upload Android assets to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" work/android-release/* --clobber
  publish:
    needs: [plan, windows, android]
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release view "v$version" --json assets > release-assets.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const version=JSON.parse(fs.readFileSync('package.json')).version;
          const names=new Set(JSON.parse(fs.readFileSync('release-assets.json')).assets.map(asset=>asset.name));
          for(const name of [`Xuxian_${version}_x64-setup.exe`,`Xuxian_${version}_x64-setup.exe.sig`,'latest.json',`Xuxian_${version}_android.apk`,`Xuxian_${version}_android.apk.sig`,'android-latest.json']) {
            if(!names.has(name))throw Error(`Release asset missing: ${name}`);
          }
          JS
          gh release edit "v$version" --draft=false --latest
