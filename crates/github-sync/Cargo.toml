[package]
name = "xuxian-github-sync"
version = "2.8.0"
edition = "2021"
license = "MIT"

[dependencies]
xuxian-story-store = { path = "../story-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "system-proxy"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
