function routeDialog(id=null){const r=id?R(id):{name:'路线 '+String.fromCharCode(65+project.routes.length),color:PALETTE[project.routes.length%PALETTE.length]};let color=r.color;modal(id?'编辑路线':'新路线',`<div class="field"><label>名称</label><input class="input" id="route-name" value="${attr(r.name)}" maxlength="200" autofocus></div><div class="field"><label>颜色</label>${colorHTML(color)}</div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="route-save">保存</button>');bindColors(c=>color=c);$('#route-save').onclick=()=>{const name=$('#route-name').value.trim();if(!name)return toast('请输入路线名称');mutate(()=>{if(id){r.name=name;r.color=color;}else project.routes.push({id:uid('route'),name,color});});closeModal();};}
function colorHTML(c){return `<div class="color-picker">${PALETTE.map(x=>`<button class="color-dot ${c===x?'selected':''}" style="background:${x}" data-color="${x}" title="${x}" aria-label="颜色 ${x}"></button>`).join('')}</div>`;}
function bindColors(fn){$$('[data-color]',$('#modal-root')).forEach(b=>b.onclick=()=>{$$('[data-color]',$('#modal-root')).forEach(x=>x.classList.toggle('selected',x===b));fn(b.dataset.color);});}
function arrangeBoard(){mutate(()=>project.routes.forEach(r=>routeChapters(r.id).forEach((c,i)=>c.y=112+i*218)));toast('已按当前顺序整理');}
function newDialog(){modal('新剧本',`<div class="field"><label>名称</label><input class="input" id="new-title" value="未命名剧本" maxlength="200" autofocus></div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="new-create">创建</button>');$('#new-create').onclick=()=>{const name=$('#new-title').value.trim()||'未命名剧本';closeModal();guardReplace(()=>adopt(newProject(name),'',null,true));};}
function chapterMenu(id,anchor){const c=C(id);menu(anchor,[{label:'打开阶段',icon:'layers',click:()=>go('chapter',id)},{label:'章节设置',icon:'settings',click:()=>chapterDialog(id)},{label:'解锁条件',icon:'link',click:()=>rulesDialog(id)},{label:'章节笔记',icon:'note',click:()=>notesDialog('chapter',id)},{label:'接续新章节',icon:'plus',click:()=>addChapterDialog(c.routeId,id)},{label:'复制章节',icon:'copy',click:()=>duplicateChapter(id)},null,{label:'删除章节',icon:'trash',danger:true,click:()=>deleteChapter(id)}]);}
function chapterDialog(id){const c=C(id);modal('章节设置',`<div class="field"><label>标题</label><input class="input" id="ch-title" value="${attr(c.title)}" maxlength="300" autofocus></div><div class="field-row"><div class="field"><label>路线</label><select class="input" id="ch-route">${project.routes.map(r=>option(r.id,r.name,c.routeId)).join('')}</select></div><div class="field"><label>章节收束</label><select class="input" id="ch-ending">${option('continue','继续',c.ending)}${option('pause','未完待续',c.ending)}${option('end','路线结局',c.ending)}</select></div></div><div class="field"><label>章节笔记</label><textarea class="input" id="ch-summary" rows="4">${esc(c.summary)}</textarea></div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="ch-save">保存</button>');$('#ch-save').onclick=()=>{const title=$('#ch-title').value.trim();if(!title)return toast('请输入章节标题');const rid=$('#ch-route').value,end=$('#ch-ending').value,note=$('#ch-summary').value;mutate(()=>{if(rid!==c.routeId)c.y=freeY(rid,c.y,c.id);c.title=title;c.routeId=rid;c.ending=end;c.summary=note;});closeModal();};}
function addChapterDialog(routeId=null,prevId=null){routeId=routeId||project.routes[0].id;prevId=prevId||routeChapters(routeId).at(-1)?.id||'';modal('新章节',`<div class="field"><label>标题</label><input class="input" id="new-ch-title" value="新章节" maxlength="300" autofocus></div><div class="field-row"><div class="field"><label>路线</label><select class="input" id="new-ch-route">${project.routes.map(r=>option(r.id,r.name,routeId)).join('')}</select></div><div class="field"><label>接续章节</label><select class="input" id="new-ch-prev"></select></div></div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="new-ch-save">创建</button>');const fill=(rid,prev)=>{$('#new-ch-prev').innerHTML=option('','无前置条件',prev)+routeChapters(rid).map(c=>option(c.id,c.title,prev)).join('');};fill(routeId,prevId);$('#new-ch-route').onchange=e=>fill(e.target.value,routeChapters(e.target.value).at(-1)?.id||'');$('#new-ch-save').onclick=()=>{const name=$('#new-ch-title').value.trim();if(!name)return toast('请输入章节标题');const rid=$('#new-ch-route').value,prev=$('#new-ch-prev').value;const c=chapter(rid,name,freeY(rid,prev?C(prev).y+218:112));if(prev)c.unlock.rules.push({id:uid('rule'),type:'chapter',targetId:prev,expected:true});mutate(()=>project.chapters.push(c));closeModal();go('chapter',c.id);};}
function duplicateChapter(id){const old=C(id),c=clone(old),stageMap=new Map();c.id=uid('chapter');c.title+=' · 副本';c.y=freeY(c.routeId,c.y+180);c.stages.forEach(s=>{const oldId=s.id;s.id=uid('stage');stageMap.set(oldId,s.id);s.rows.forEach(regenRowIds);if(s.kind==='investigation')for(const o of s.objects){o.id=uid('object');o.rows.forEach(regenRowIds);}});c.unlock.rules.forEach(r=>r.id=uid('rule'));c.stages.forEach(s=>stageRootRows(s).forEach(row=>row.options.forEach(op=>{if(op.chapterId===id){op.chapterId=c.id;op.stageId=stageMap.get(op.stageId)||'';}})));mutate(()=>project.chapters.push(c));toast('已复制章节');}
function referencesTo(chapterId,stageIds=[]){let rules=0,choices=0;for(const c of project.chapters){rules+=c.unlock.rules.filter(r=>(r.type==='chapter'&&r.targetId===chapterId)||(r.type==='stage'&&stageIds.includes(r.targetId))).length;for(const s of c.stages)for(const r of stageRootRows(s))for(const op of r.options)if((chapterId&&op.chapterId===chapterId)||stageIds.includes(op.stageId))choices++;}return {rules,choices};}
function removeReferences(chapterId,stageIds=[]){for(const c of project.chapters){c.unlock.rules=c.unlock.rules.filter(r=>!((r.type==='chapter'&&r.targetId===chapterId)||(r.type==='stage'&&stageIds.includes(r.targetId))));for(const s of c.stages)for(const row of stageRootRows(s))for(const op of row.options){if(chapterId&&op.chapterId===chapterId){op.chapterId='';op.stageId='';}else if(stageIds.includes(op.stageId))op.stageId='';}}}
function deleteChapter(id){const c=C(id),ids=c.stages.map(s=>s.id),refs=referencesTo(id,ids);confirmBox('删除章节',`删除“${c.title}”及其 ${c.stages.length} 个阶段、${linesOf(c)} 行脚本，同时移除 ${refs.rules} 条相关解锁依赖、清空 ${refs.choices} 个相关分支指向。受影响章节的解锁条件会变化。`,()=>{mutate(()=>{project.chapters=project.chapters.filter(x=>x.id!==id);removeReferences(id,ids);});validateView();render();},true);}
function inspectObjectDialog(id=null){
 const st=currentStage();if(!st||st.kind!=='investigation')return;

 modal(id?'编辑调查物品':'新调查物品',`<div class="field"><label>物品名称</label><input class="input" id="inspect-name" value="${attr(obj.name)}" maxlength="160" autofocus></div><div class="field"><label>备注</label><textarea class="input" id="inspect-notes" rows="3">${esc(obj.notes||'')}</textarea></div>`,btn('取消',null,'modal-close')+`<button class="btn primary" id="inspect-save">${id?'保存':'创建'}</button>`);
 $('#inspect-save').onclick=()=>{const name=$('#inspect-name').value.trim();if(!name)return toast('请输入调查物品名称');const notes=$('#inspect-notes').value;mutate(()=>{obj.name=name;obj.notes=notes;if(!id)st.objects.push(obj);activeInspectObjectId=obj.id;selectedRowIds.clear();selectionAnchor=null;});closeModal();};

}
function stageMenu(id,anchor){const c=currentChapter(),idx=c.stages.findIndex(s=>s.id===id);menu(anchor,[{label:'编辑阶段',icon:'edit',click:()=>stageDialog(id)},{label:'上移',icon:'up',disabled:idx<=0,click:()=>mutate(()=>c.stages.splice(idx-1,0,c.stages.splice(idx,1)[0]))},{label:'下移',icon:'down',disabled:idx>=c.stages.length-1,click:()=>mutate(()=>c.stages.splice(idx+1,0,c.stages.splice(idx,1)[0]))},{label:'复制阶段',icon:'copy',click:()=>duplicateStage(id)},null,{label:'删除阶段',icon:'trash',danger:true,click:()=>deleteStage(id)}]);}
function stageDialog(id=null){
 const c=currentChapter(),s=id?c.stages.find(s=>s.id===id):stage('阶段 '+String(c.stages.length+1).padStart(2,'0'));
 modal(id?'编辑阶段':'新阶段',`<div class="field"><label>名称</label><input class="input" id="st-title" value="${attr(s.title)}" maxlength="300" autofocus></div><div class="field"><label>阶段类型</label><select class="input" id="st-kind">${option('story','剧情阶段',s.kind||'story')}${option('investigation','调查阶段',s.kind||'story')}</select></div><div class="field"><label>阶段笔记</label><textarea class="input" id="st-notes" rows="4">${esc(s.notes)}</textarea></div>`,btn('取消',null,'modal-close')+`<button class="btn primary" id="st-save">${id?'保存':'创建'}</button>`);
 $('#st-save').onclick=()=>{const title=$('#st-title').value.trim();if(!title)return toast('请输入阶段名称');const notes=$('#st-notes').value,kind=$('#st-kind').value;
 if(id&&kind!==s.kind&&branchRowCount(s)>0)return toast('阶段已有脚本。请先复制阶段，再修改空白阶段的类型。',true);
 mutate(()=>{s.title=title;s.notes=notes;s.kind=kind;if(!id)c.stages.push(s);});closeModal();if(!id)go('stage',c.id,s.id);};
}
function duplicateStage(id){const c=currentChapter(),idx=c.stages.findIndex(s=>s.id===id),s=clone(c.stages[idx]);s.id=uid('stage');s.title+=' · 副本';s.rows.forEach(regenRowIds);if(s.kind==='investigation')for(const o of s.objects){o.id=uid('object');o.rows.forEach(regenRowIds);}mutate(()=>c.stages.splice(idx+1,0,s));}
function deleteStage(id){const c=currentChapter(),s=c.stages.find(s=>s.id===id),refs=referencesTo('',[id]);confirmBox('删除阶段',`删除“${s.title}”及其 ${branchRowCount(s)} 行脚本，同时移除 ${refs.rules} 条阶段解锁依赖、重置 ${refs.choices} 个分支的目标阶段。`,()=>mutate(()=>{c.stages=c.stages.filter(x=>x.id!==id);removeReferences('',[id]);}),true);}
function notesDialog(type,id){const obj=type==='chapter'?C(id):S(id)?.stage,key=type==='chapter'?'summary':'notes';if(!obj)return;modal(type==='chapter'?'章节笔记':'阶段笔记',`<div class="field"><textarea class="input" id="notes-text" rows="10" autofocus>${esc(obj[key])}</textarea></div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="notes-save">保存</button>');$('#notes-save').onclick=()=>{const val=$('#notes-text').value;mutate(()=>obj[key]=val);closeModal();};}
function characterDialog(id=null,onCreated=null){const p=id?P(id):{id:uid('char'),name:'',color:PALETTE[project.characters.length%PALETTE.length],notes:'',expressions:['平静','微笑','疑惑','惊讶','严肃'],actions:[]};let color=p.color;modal(id?'编辑角色':'新角色',`<div class="field"><label>姓名</label><input class="input" id="char-name" value="${attr(p.name)}" maxlength="120" autofocus></div><div class="field"><label>颜色</label>${colorHTML(color)}</div><div class="field"><label>常用表情 <span class="tiny">· 逗号分隔</span></label><input class="input" id="char-expressions" value="${attr(p.expressions.join('，'))}"></div><div class="field"><label>常用动作 <span class="tiny">· 逗号分隔</span></label><input class="input" id="char-actions" value="${attr(p.actions.join('，'))}"></div><div class="field"><label>角色笔记</label><textarea class="input char-note" id="char-notes" rows="3">${esc(p.notes)}</textarea></div>${id?'<div class="danger-zone"><span></span><button class="btn danger small" id="char-delete">删除角色</button></div>':''}`,btn('取消',null,'modal-close')+'<button class="btn primary" id="char-save">保存</button>');bindColors(c=>color=c);$('#char-save').onclick=()=>{const name=$('#char-name').value.trim();if(!name)return toast('请输入角色姓名');if(project.characters.some(c=>c.id!==id&&c.name===name))return toast('已有同名角色');const expr=[...new Set($('#char-expressions').value.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean))],actions=[...new Set($('#char-actions').value.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean))],notes=$('#char-notes').value;mutate(()=>{Object.assign(p,{name,color,expressions:expr,actions,notes});if(!id)project.characters.push(p);if(onCreated)onCreated(p.id);});closeModal();};if(id)$('#char-delete').onclick=()=>{let n=0;for(const c of project.chapters)for(const s of c.stages)for(const r of flattenRows(stageRootRows(s)))if(r.speakerId===id)n++;confirmBox('删除角色',`“${p.name}”被 ${n} 行对白引用。删除后，这些行的说话人会变为旁白，文字、动作和表情保留。`,()=>mutate(()=>{project.characters=project.characters.filter(c=>c.id!==id);for(const c of project.chapters)for(const s of c.stages)for(const r of flattenRows(stageRootRows(s)))if(r.speakerId===id)r.speakerId='';}),true);};}
function rulesDialog(id){const c=C(id);if(!c)return;let draft=clone(c.unlock),newFlags=[];
function targets(type,current){let opts=[];if(type==='chapter')opts=project.chapters.filter(x=>x.id!==id).map(x=>[x.id,`${R(x.routeId)?.name} / ${x.title}`]);if(type==='stage')opts=project.chapters.filter(x=>x.id!==id).flatMap(x=>x.stages.map(s=>[s.id,`${x.title} / ${s.title}`]));if(type==='flag')opts=[...project.flags,...newFlags].map(x=>[x.id,x.name]);return option('','选择目标',current)+opts.map(([v,t])=>option(v,t,current)).join('');}
function draw(){modal('解锁 · '+c.title,`<div class="rule-mode"><button data-mode="all" class="${draft.mode==='all'?'selected':''}" title="所有条件均满足时解锁">全部满足</button><button data-mode="any" class="${draft.mode==='any'?'selected':''}" title="任意一个条件满足时解锁">任一满足</button></div><div id="rule-list">${draft.rules.length?draft.rules.map((r,i)=>`<div class="rule-row" data-rule-index="${i}"><select class="input" data-rule-field="type" aria-label="条件类型">${option('chapter','章节',r.type)}${option('stage','阶段',r.type)}${option('flag','自定条件',r.type)}</select><select class="input" data-rule-field="targetId" aria-label="条件目标">${targets(r.type,r.targetId)}</select>${r.type==='flag'?`<select class="input expected-select" data-rule-field="expected" aria-label="条件取值">${option('true','已达成',String(r.expected!==false))}${option('false','未达成',String(r.expected!==false))}</select>`:'<span class="rule-state">已完成</span>'}<button class="icon-btn" data-rule-delete="${i}" title="移除此条件">${ico('close')}</button></div>`).join(''):`<div class="rule-empty">${ico('play')}<span>无前置条件</span></div>`}</div><div style="display:flex;gap:8px;margin-top:19px"><button class="btn small" id="rule-add">${ico('plus')}条件</button><button class="btn ghost small" id="rule-new-flag">${ico('flag')}新建自定条件</button></div><div id="new-rule-flag" class="hidden"><div class="field-row"><div class="field"><input class="input" id="local-flag-name" placeholder="条件名称" aria-label="新条件名称" maxlength="200"></div><div class="field" style="flex:0;justify-content:center"><button class="btn" id="local-flag-add">创建</button></div></div></div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="rules-apply">保存</button>',true);
$$('[data-mode]').forEach(b=>b.onclick=()=>{draft.mode=b.dataset.mode;draw();});
$$('[data-rule-field]').forEach(el=>el.onchange=()=>{const row=el.closest('[data-rule-index]'),rule=draft.rules[+row.dataset.ruleIndex],key=el.dataset.ruleField;if(key==='type'){rule.type=el.value;rule.targetId='';rule.expected=true;draw();}else if(key==='expected')rule.expected=el.value==='true';else rule.targetId=el.value;});
$$('[data-rule-delete]').forEach(b=>b.onclick=()=>{draft.rules.splice(+b.dataset.ruleDelete,1);draw();});
$('#rule-add').onclick=()=>{draft.rules.push({id:uid('rule'),type:'chapter',targetId:'',expected:true});draw();};
$('#rule-new-flag').onclick=()=>{$('#new-rule-flag').classList.remove('hidden');$('#local-flag-name').focus();};
$('#local-flag-add').onclick=()=>{const name=$('#local-flag-name').value.trim();if(!name)return toast('请输入条件名称');let f=[...project.flags,...newFlags].find(x=>x.name===name);if(!f){f={id:uid('flag'),name,notes:''};newFlags.push(f);}draft.rules.push({id:uid('rule'),type:'flag',targetId:f.id,expected:true});draw();};
$('#rules-apply').onclick=()=>{if(draft.rules.some(r=>!r.targetId))return toast('请为每条条件选择目标');const seen=new Set();draft.rules=draft.rules.filter(r=>{const key=r.type+':'+r.targetId+':'+r.expected;if(seen.has(key))return false;seen.add(key);return true;});mutate(()=>{c.unlock=draft;project.flags.push(...newFlags);});closeModal();};}

async function refreshProjectLibrary(){if(!BRIDGE){renderProjectLibrary();return;}if(libraryBusy)return;libraryBusy=true;try{const d=await bridgeCall('projects/list');libraryItems=Array.isArray(d.items)?d.items:[];renderProjectLibrary();}catch(e){$('#library-grid').innerHTML=`<div class="library-empty">无法读取项目文件夹 <small>${esc(e.message)}</small></div>`;toast('项目列表读取失败：'+e.message,true);}finally{libraryBusy=false;$('#library-status').textContent='本地 · 剧本项目';}}

 const create=()=>{const title=$('#library-new-name')?.value.trim();if(!title)return toast('请输入项目名称',true);closeModal();
  const run=async()=>{try{if(BRIDGE){const p=newProject(title),d=await bridgeCall('projects/create',{text:JSON.stringify(p,null,2)});adopt(normalizeProject(JSON.parse(d.text)),d.name,null,false,d.stamp,d.bindingId);}else adopt(newProject(title),'',null,true);toast('已创建 '+title);}catch(e){toast('创建失败：'+e.message,true);}};guardReplace(run);

 $('#library-rename-submit').onclick=()=>{const title=$('#library-rename-name').value.trim();if(!title)return toast('请输入项目名称',true);closeModal();const run=async()=>{try{const d=await bridgeCall('projects/rename',{fileName:p.fileName,title});if(sourceName===p.fileName){adopt(normalizeProject(JSON.parse(d.text)),d.name,null,false,d.stamp,d.bindingId);showProjectLibrary();}else await refreshProjectLibrary();toast('已重命名');}catch(e){toast('重命名失败：'+e.message,true);}};if(sourceName===p.fileName)guardReplace(run);else run();};
}
function deleteManagedProject(p){confirmBox('删除项目',`将「${p.title}」移入「剧本项目/_回收站」，不会直接永久删除。`,async()=>{try{if(dirty&&sourceName===p.fileName){toast('当前项目有未保存的改动，请先保存或返回项目列表',true);return;}await bridgeCall('projects/delete',{fileName:p.fileName});if(sourceName===p.fileName){adopt(newProject(),'',null,false);showProjectLibrary();}else await refreshProjectLibrary();toast('已移入回收站');}catch(e){toast('删除失败：'+e.message,true);}},true);}
function importSourceAction(){if(BRIDGE||!window.showOpenFilePicker){$('#file-input').click();}else openStandaloneSource();}

 const run=async()=>{try{const d=await bridgeCall('projects/create',{text:JSON.stringify(p,null,2)});adopt(normalizeProject(JSON.parse(d.text)),d.name,null,false,d.stamp,d.bindingId);toast('已导入 '+p.title);}catch(e){toast('导入失败：'+e.message,true);}};
 guardReplace(run);
}catch(e){toast('导入失败：'+e.message,true);}}
function adopt(p,name='',handle=null,isNew=false,stamp=null,binding=null){$('#project-library')?.classList.add('hidden');collapsedOptionIds.clear();project=p;sourceName=name;fileHandle=handle;fileStamp=stamp;bridgeBinding=binding;history=[];future=[];lastEdit='';dirty=isNew;exported=false;view={type:'board'};zoom=1;boardScroll={x:0,y:0};connectFrom=null;sim={active:false,chapters:new Set(),stages:new Set(),flags:new Set()};closeModal();render();persist();if(handle)rememberHandle();}
function loadText(txt,name,handle,stamp,binding=null){try{if(txt.length>25*1024*1024)throw Error('文件超过 25 MB，请使用拆分后的剧本');const p=normalizeProject(JSON.parse(txt.replace(/^\uFEFF/,'')));guardReplace(()=>{adopt(p,name,handle,false,stamp,binding);toast('已打开 '+name);});}catch(e){toast(e instanceof SyntaxError?'无法读取：JSON 格式错误':e.message||'无法读取此文件',true);}}
async function loadFile(file,handle=null){try{if(file.size>25*1024*1024)throw Error('文件超过 25 MB，请使用拆分后的剧本');loadText(await file.text(),file.name,handle,{size:file.size,lastModified:file.lastModified});}catch(e){toast(e.message||'无法读取此文件',true);}}
async function openSource(){return showProjectLibrary();}
async function openStandaloneSource(){if(typeof window.showOpenFilePicker==='function'){try{const [handle]=await window.showOpenFilePicker({id:'xuxian-source',multiple:false,types:[{description:'叙线剧本源文件',accept:{'application/json':['.json']}}]});if(handle){const f=await handle.getFile();await loadFile(f,handle);}return;}catch(e){if(e.name==='AbortError')return;toast('无法关联文件写入权限，将使用普通导入',true);}}$('#file-input').click();}
function fileName(){return (project.title||'未命名剧本').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,120)+'.story.json';}
function downloadText(text,name,type='application/json'){const blob=new Blob([text],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function downloadSource(){const name=sourceName||fileName(),text=JSON.stringify(project,null,2);downloadText(text,name);dirty=false;exported=true;persist();toast('已下载源文件副本（未覆盖磁盘原件）');return true;}
function fileConflict(){modal('源文件已改变','<div class="help"><p>磁盘上的 JSON 在上次打开或保存之后发生过修改。直接覆盖会替换这些外部改动。</p></div>',btn('取消',null,'modal-close')+'<button class="btn" id="conflict-copy">另存</button><button class="btn danger" id="conflict-write">覆盖原文件</button>');$('#conflict-copy').onclick=()=>{closeModal();saveSource(true);};$('#conflict-write').onclick=()=>{closeModal();saveSource(false,true);};}
function cannotWriteDialog(){modal('当前浏览器不能直接写回',`<div class="help"><p>Firefox 的普通 HTML 页面无法覆盖磁盘上的 JSON。</p><p>Windows 可使用压缩包里的「启动叙线.cmd」，然后正常打开、保存；也可以用 Chrome / Edge 打开 HTML。</p></div>`,btn('取消',null,'modal-close')+'<button class="btn primary" id="download-fallback">下载副本</button>');$('#download-fallback').onclick=()=>{closeModal();downloadSource();};}
async function chooseLinkForExisting(){const [h]=await window.showOpenFilePicker({id:'xuxian-source',multiple:false,types:[{description:'叙线剧本源文件',accept:{'application/json':['.json']}}]});if(!h)return null;const f=await h.getFile();let other;try{other=normalizeProject(JSON.parse((await f.text()).replace(/^\uFEFF/,'')));}catch(e){throw Error('所选 JSON 不是有效的叙线源文件');}if(other.id!==project.id)throw Error('所选文件属于另一份剧本，请选择原 JSON 或使用「另存」');const previous=fileStamp;fileHandle=h;sourceName=h.name;fileStamp={size:f.size,lastModified:f.lastModified};if(previous&&(previous.size!==fileStamp.size||previous.lastModified!==fileStamp.lastModified))return 'conflict';return h;}
async function saveSource(asNew=false,force=false){if(saving)return false;saving=true;$('#save-btn').disabled=true;try{const snapshot=JSON.stringify(project,null,2);
if(BRIDGE){
let result,created=null;
try{
 if(asNew){created=clone(project);created.id=uid('project');created.title+=' 副本';created.createdAt=now();created.updatedAt=now();result=await bridgeCall('projects/create',{text:JSON.stringify(created,null,2)});}
 else if(!bridgeBinding){result=await bridgeCall('projects/create',{text:snapshot});}
 else result=await bridgeCall('save',{text:snapshot,bindingId:bridgeBinding,stamp:fileStamp,force});
}catch(e){if(e.status===409){fileConflict();return false;}throw e;}
if(result.cancelled)return false;
if(created){adopt(normalizeProject(JSON.parse(result.text)),result.name,null,false,result.stamp,result.bindingId);}else{
 bridgeBinding=result.bindingId;fileHandle=null;sourceName=result.name;fileStamp=result.stamp;
 dirty=JSON.stringify(project,null,2)!==snapshot;exported=false;persist();
}
toast((asNew?'已另存 ': '已写回 ')+sourceName);return true;
}
let h=asNew?null:fileHandle;
if(!h&&!asNew&&sourceName&&typeof window.showOpenFilePicker==='function'){
const selected=await chooseLinkForExisting();if(selected==='conflict'){fileConflict();return false;}h=selected;
}
if(!h){if(typeof window.showSaveFilePicker==='function'){h=await window.showSaveFilePicker({id:'xuxian-source',suggestedName:sourceName||fileName(),types:[{description:'叙线剧本源文件',accept:{'application/json':['.json']}}]});}else{cannotWriteDialog();return false;}}
if(!h)return false;
if(h===fileHandle&&fileStamp&&!force){const f=await h.getFile();if(f.lastModified!==fileStamp.lastModified||f.size!==fileStamp.size){fileConflict();return false;}}
const stream=await h.createWritable();try{await stream.write(snapshot);await stream.close();}catch(e){try{await stream.abort();}catch(_){}throw e;}fileHandle=h;sourceName=h.name;const f=await h.getFile();fileStamp={size:f.size,lastModified:f.lastModified};dirty=JSON.stringify(project,null,2)!==snapshot;exported=false;persist();rememberHandle();toast('已写回 '+sourceName);return true;
}catch(e){if(e.name==='AbortError')return false;toast('保存未完成：'+(e.message||'文件不可写'),true);return false;}finally{saving=false;$('#save-btn').disabled=false;updateTop();}}
function appendMarkdownRows(out,rows,indent=''){
 for(const row of rows){
  if(row.type==='note'){out.push(indent+'〔笔记〕'+row.text,'');continue;}
  if(row.type==='effect'){out.push(indent+'〔画面效果〕'+row.text,'');continue;}
  if(row.type==='branch'){
   out.push(indent+'〔选项〕'+row.text,'');
   for(const op of row.options){out.push(indent+'- **'+op.text+'**','');appendMarkdownRows(out,op.rows||[],indent+'    ');out.push(indent+(op.mode==='jump'?'↳ 跳转：'+(C(op.chapterId)?.title||'未设置章节')+(op.stageId?' / '+(S(op.stageId)?.stage.title||'未设置阶段'):''):'↳ 合流，继续下一行'),'');}
   continue;
  }
  out.push(indent+'**'+(P(row.speakerId)?.name||'旁白')+'**'+([row.expression,row.action].some(Boolean)?' 〔'+[row.expression,row.action].filter(Boolean).join(' · ')+'〕':''),indent+row.text,'');
 }
}
function exportMarkdown(){const out=['# '+project.title,'','> 叙线可读剧本 · '+new Date().toLocaleString('zh-CN'),''];if(project.characters.length){out.push('## 角色','');for(const p of project.characters)out.push('### '+p.name,p.notes||'',p.expressions.length?'表情：'+p.expressions.join(' / '):'',p.actions.length?'动作：'+p.actions.join(' / '):'','');}for(const r of project.routes){out.push('---','','## '+r.name,'');for(const c of routeChapters(r.id)){out.push('### '+c.title,'');if(c.ending!=='continue')out.push('收束：'+(c.ending==='pause'?'未完待续':'路线结局'),'');if(c.unlock.rules.length)out.push('解锁（'+(c.unlock.mode==='all'?'全部满足':'任一满足')+'）：',...c.unlock.rules.map(rule=>'- '+ruleTitle(rule)+(rule.type==='flag'?(rule.expected===false?'：未达成':'：已达成'):'：已完成')),'');if(c.summary)out.push(c.summary,'');for(const st of c.stages){out.push('#### '+st.title+' ['+(st.kind==='investigation'?'调查':'剧情')+']','');if(st.notes)out.push('> '+st.notes.replace(/\n/g,'\n> '),'');if(st.kind==='investigation'){for(const o of st.objects||[]){out.push('##### '+o.name,'');if(o.notes)out.push('> '+o.notes.replace(/\n/g,'\n> '),'');appendMarkdownRows(out,o.rows);}}else appendMarkdownRows(out,st.rows);}}}downloadText(out.join('\n'),fileName().replace('.story.json','.md'),'text/markdown');toast('已导出可读剧本');}
function backupDialog(){let arr=[];try{arr=JSON.parse(localStorage.getItem(BACKUPS)||'[]');}catch(e){}modal('最近备份',arr.length?arr.map((b,i)=>`<button class="search-item" data-backup="${i}"><strong>${esc(b.title)}</strong><small>${esc(new Date(b.at).toLocaleString('zh-CN'))}</small></button>`).join(''):'<div class="empty-centered">暂无切换前的本地备份</div>',btn('关闭',null,'modal-close'));$$('[data-backup]').forEach(b=>b.onclick=()=>{let p;try{p=normalizeProject(arr[+b.dataset.backup].project);}catch(e){return toast(e.message,true);}closeModal();guardReplace(()=>{adopt(p,'',null,true);toast('已恢复备份');});});}
function helpDialog(){modal('使用说明',`<div class="help"><h3>项目</h3><p>启动器扫描「剧本项目」文件夹。一份 JSON 对应一个项目，自动列出可新建、复制、重命名、删除的项目。Ctrl+S 保存回原文件；删除项目会先移至回收站。</p><h3>脚本</h3><p>路线 → 章节 → 剧情阶段 / 调查阶段。调查阶段可创建调查物品，每个物品下独立编排脚本；点击物品卡片展开相应对白。每行对白可设置说话人、对白、表情、动作。Enter 在同一句中换行，Alt+Enter 添加对白。「＋描述」添加没有序号的独立演出描述行，适合镜头、画面、音效与转场。</p><p>选项组内可创建多个选项、分别编写对白与描述。每个选项独立设置「合流」或「跳转」，跳转可指定目标章节与阶段；只有跳转到其他章节的分支在路线图上形成虚线。旧版的「局部选项」和「章节跳转」打开后都会自动升级为选项组。</p><h3>行操作</h3><p>点击行号可选中整行，描述行点击左侧小圆点；Shift 连选，Ctrl/⌘ 单选。选择后按 Delete 删除整行，可以 Ctrl/⌘ Z 撤销；在输入框中按 Delete 则正常删字。Ctrl/⌘ C/V 复制粘贴选中行，也支持跨章节、跨阶段。文字框本身保持普通文字复制。</p><h3>路线</h3><p>在路线图管理章节位置和解锁条件。阶段可以分别设置剧情或调查类型、标题、笔记、顺序；有脚本内容的阶段不可直接更换类型，以避免误丢失内容。解锁可依赖完成其他章节、完成某阶段或自定义条件。「演练」用于检查解锁关系，不影响剧本数据。</p><h3>保存</h3><p>Windows：用「启动叙线.cmd」打开。支持本地扫描项目和直接 JSON 写回。单独打开 HTML 时浏览器访问本地磁盘受到权限限制；Chrome/Edge 可在授权后写回，其他浏览器可下载文件副本。升级前请备份项目 JSON。v1.7 使用 JSON v3 格式，支持读取旧 v1–v2 文件，旧版编辑器不支持新的选项与描述结构。</p></div>`,btn('关闭',null,'modal-close'),true);}

case 'chapter-menu':chapterMenu(id,el);break;

 case 'branch-row-menu':branchRowMenu(id,el);break;

 case 'local-toggle':{const section=el.closest('.local-option'),folded=section.classList.toggle('collapsed'),oid=section.dataset.option;folded?collapsedOptionIds.add(oid):collapsedOptionIds.delete(oid);el.setAttribute('aria-expanded',String(!folded));break;}
 case 'local-add-option':{const row=currentRows()?.find(r=>r.id===id);if(!row||row.type!=='branch')break;mutate(()=>row.options.push({id:uid('opt'),text:'选项 '+String.fromCharCode(65+row.options.length),mode:'continue',chapterId:'',stageId:'',rows:[line()]}));break;}
 case 'branch-add-line':{const row=currentRows()?.find(r=>r.id===id),op=row?.options.find(o=>o.id===el.dataset.option);if(!op)break;const r=line();mutate(()=>op.rows.push(r));focusRow(r.id);break;}
 case 'branch-add-effect':{const row=currentRows()?.find(r=>r.id===id),op=row?.options.find(o=>o.id===el.dataset.option);if(!op)break;const r=line('effect');mutate(()=>op.rows.push(r));focusRow(r.id);break;}
 case 'branch-action-presets':{const loc=rowLocation(id),p=P(loc?.row.speakerId);if(p)menu(el,p.actions.map(action=>({label:action,click:()=>mutate(()=>loc.row.action=action)})));break;}

 case 'copy-rows':copyRowsButton();break;
 case 'delete-selected':deleteSelectedRows();break;
 case 'paste-rows':pasteRowsButton();break;
 case 'clear-rows':selectedRowIds.clear();selectionAnchor=null;syncRowSelection();break;
case 'script-menu':scriptMenu(el);break;
case 'action-presets':{const row=currentRows()?.find(r=>r.id===id),p=P(row?.speakerId);if(p)menu(el,p.actions.map(action=>({label:action,click:()=>mutate(()=>row.action=action)})));break;}
case 'read-stage':readStage();break;
case 'port-out':connectFrom=connectFrom===id?null:id;render();break;
case 'port-in':addConnection(id);break;
case 'connection-toggle':connectFrom=connectFrom?null:'__choose';render();if(connectFrom)toast('点击前置章节下方圆点，再点击目标章节上方圆点');break;
case 'cancel-connect':connectFrom=null;render();break;
case 'zoom-in':setZoom(zoom+.1);break;
case 'zoom-out':setZoom(zoom-.1);break;
case 'zoom-reset':setZoom(1);break;
case 'fit-board':fitBoard();break;
case 'sim-toggle':sim.active=!sim.active;reconcileSimulation();render();break;
case 'sim-reset':sim.chapters.clear();sim.stages.clear();sim.flags.clear();render();toast('演练已重置');break;
case 'sim-flags':flagsDialog(true);break;
case 'complete-chapter':toggleChapter(id);break;
case 'complete-stage':toggleStage(id);break;
case 'modal-close':closeModal();break;
}}
document.addEventListener('click',ev=>{
 if(Date.now()<dragSuppressUntil)return;
 const row=ev.target.closest('.branch-script-row,.script-row');
 if(row&&view.type==='stage'&&!$('#modal-root').firstChild){
  const gutter=ev.target.closest('.row-select,.row-number');
  const interactive=ev.target.closest('button,input,textarea,select,.drag-handle');
  if(gutter||!interactive||((ev.shiftKey||ev.ctrlKey||ev.metaKey)&&!ev.target.closest('[data-act]'))){
   selectRow(row.dataset.branchRow||row.dataset.row,{shift:ev.shiftKey,toggle:ev.ctrlKey||ev.metaKey});
   if(interactive&&!gutter&&(ev.shiftKey||ev.ctrlKey||ev.metaKey))ev.preventDefault();
   return;
  }
 }
 const el=ev.target.closest('[data-act]');if(el){ev.stopPropagation();dispatch(el.dataset.act,el);}
});
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.menu')&&!ev.target.closest('#menu-btn'))closeMenu();});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='project-name'){edit('project:title',()=>project.title=t.value);return;}if(t.dataset.bind){const key=t.dataset.bind;if(key==='chapter-title')edit('chapter:'+view.chapterId,()=>currentChapter().title=t.value);else if(key==='stage-title')edit('stage:'+view.stageId,()=>currentStage().title=t.value);return;}if(t.dataset.branchField&&t.tagName!=='SELECT'){const id=t.closest('[data-branch-row]')?.dataset.branchRow,loc=rowLocation(id);if(!loc)return;edit('row:'+id+':'+t.dataset.branchField,()=>loc.row[t.dataset.branchField]=t.value);if(t.tagName==='TEXTAREA')autoSize(t);return;}if(t.dataset.rowField&&t.tagName!=='SELECT'){const id=t.closest('[data-row]').dataset.row,r=currentRows()?.find(r=>r.id===id);if(!r)return;edit('row:'+id+':'+t.dataset.rowField,()=>r[t.dataset.rowField]=t.value);if(t.tagName==='TEXTAREA')autoSize(t);return;}if(t.dataset.optionField&&t.tagName!=='SELECT'){const id=t.closest('[data-row]').dataset.row,oid=t.closest('[data-option]').dataset.option,row=currentRows()?.find(r=>r.id===id),op=row?.options.find(o=>o.id===oid);edit('option:'+oid+':'+t.dataset.optionField,()=>op[t.dataset.optionField]=t.value);}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.branchField&&t.tagName==='SELECT'){const loc=rowLocation(t.closest('[data-branch-row]')?.dataset.branchRow);if(!loc)return;if(t.value==='__new'){t.value=loc.row.speakerId;characterDialog(null,charId=>loc.row.speakerId=charId);}else mutate(()=>loc.row[t.dataset.branchField]=t.value);return;}if(t.dataset.rowField&&t.tagName==='SELECT'){const id=t.closest('[data-row]').dataset.row,row=currentRows()?.find(r=>r.id===id);if(!row)return;if(t.value==='__new'){t.value=row.speakerId;characterDialog(null,charId=>row.speakerId=charId);}else mutate(()=>row[t.dataset.rowField]=t.value);return;}if(t.dataset.optionField&&t.tagName==='SELECT'){const id=t.closest('[data-row]').dataset.row,oid=t.closest('[data-option]').dataset.option,row=currentRows()?.find(r=>r.id===id),op=row?.options.find(o=>o.id===oid);const key=t.dataset.optionField,value=t.value;mutate(()=>{op[key]=value;if(key==='chapterId')op.stageId='';});}});
document.addEventListener('copy',ev=>{
 if(view.type!=='stage'||!selectedRowIds.size||$('#modal-root').firstChild||hasNativeTextSelection(ev.target))return;
 const bundle=rememberRows(collectRows());if(!bundle)return;
 if(ev.clipboardData){ev.clipboardData.setData(ROW_MIME,JSON.stringify(bundle));ev.clipboardData.setData('text/plain',bundle.text);ev.preventDefault();}
 toast('已复制 '+bundle.rows.length+' 行');
});
document.addEventListener('paste',ev=>{
 if(view.type!=='stage'||$('#modal-root').firstChild||rowsAreEditable(ev.target))return;
 let bundle=parseRows(ev.clipboardData?.getData(ROW_MIME)||'');
 if(!bundle&&rowClipboard&&ev.clipboardData?.getData('text/plain')===rowClipboard.text)bundle=rowClipboard;
 if(bundle){ev.preventDefault();pasteRows(bundle);}
});
document.addEventListener('compositionstart',()=>composition=true);document.addEventListener('compositionend',()=>composition=false);
document.addEventListener('keydown',ev=>{if(composition||ev.isComposing||ev.keyCode===229)return;const mod=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();if(mod&&['s','o','k','z','y'].includes(k)){if(k==='s'){ev.preventDefault();saveSource(ev.shiftKey);return;}if(k==='o'){ev.preventDefault();openSource();return;}if(k==='k'){ev.preventDefault();searchDialog();return;}if($('#modal-root').firstChild&&['z','y'].includes(k))return;ev.preventDefault();if(k==='y'||(k==='z'&&ev.shiftKey))redo();else if(k==='z')undo();return;}if(ev.key==='Delete'&&!mod&&!ev.altKey&&view.type==='stage'&&selectedRowIds.size&&!$('#modal-root').firstChild&&!libraryVisible()&&!rowsAreEditable(ev.target)){ev.preventDefault();deleteSelectedRows();return;}if(ev.key==='Escape'){if($('#menu-root').firstChild)closeMenu();else if($('#modal-root').firstChild)closeModal();else if(libraryVisible())closeProjectLibrary();else if(connectFrom){connectFrom=null;render();}return;}if(ev.altKey&&ev.key==='Enter'&&view.type==='stage'&&!$('#modal-root').firstChild){ev.preventDefault();const inside=document.activeElement.closest('[data-branch-row]');if(inside){const loc=rowLocation(inside.dataset.branchRow),r=line();if(loc){mutate(()=>loc.rows.splice(loc.rows.indexOf(loc.row)+1,0,r));focusRow(r.id);}return;}addRow('dialogue',document.activeElement.closest('[data-row]')?.dataset.row||null);return;}if(ev.key==='Enter'&&ev.target.matches('[tabindex="0"][data-act]')){ev.preventDefault();ev.target.click();}if(ev.key==='Tab'&&$('#modal-root').firstChild){const elements=$$('button,input,select,textarea,[tabindex="0"]',$('#modal-root')).filter(e=>!e.disabled&&e.offsetParent!==null);const first=elements[0],last=elements.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}}});
$('#library-refresh').innerHTML=ico('reset');$('#library-folder').innerHTML=ico('folder');$('#library-folder').onclick=async()=>{if(!BRIDGE)return;try{await bridgeCall('projects/open-folder');}catch(e){toast('无法打开项目文件夹：'+e.message,true);}};$('#library-refresh').onclick=refreshProjectLibrary;$('#library-create').onclick=newHubDialog;$('#library-import').onclick=importSourceAction;$('#library-close').onclick=closeProjectLibrary;$('#brand').innerHTML=ico('logo')+'<span>叙线</span>';$('#brand').onclick=()=>go('board');$('#undo-btn').innerHTML=ico('undo');$('#undo-btn').onclick=undo;$('#search-btn').innerHTML=ico('search');$('#search-btn').onclick=searchDialog;$('#menu-btn').innerHTML=ico('dots');$('#menu-btn').onclick=e=>topMenu(e.currentTarget);$('#open-btn').onclick=openSource;$('#save-btn').onclick=()=>saveSource();
$('#project-name').addEventListener('blur',()=>{if(!project.title.trim()){edit('project:title',()=>project.title='未命名剧本');$('#project-name').value=project.title;}});
$('#file-input').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await importSelectedSource(f);};
window.addEventListener('beforeunload',ev=>{clearTimeout(cacheTimer);persist();if(dirty&&!suppressUnload){ev.preventDefault();ev.returnValue='';}});
let dragDepth=0;function clearFileDrop(){dragDepth=0;$('.file-drop-overlay')?.remove();}
document.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();dragDepth++;if(!$('.file-drop-overlay')){const n=document.createElement('div');n.className='file-drop-overlay';n.innerHTML=ico('file')+'<span>打开源文件</span>';document.body.append(n);}}});
document.addEventListener('dragleave',e=>{if([...e.dataTransfer.types].includes('Files')){dragDepth--;if(dragDepth<=0)clearFileDrop();}});
document.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault();});
document.addEventListener('drop',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();clearFileDrop();if(e.dataTransfer.files.length!==1)return toast('一次只打开一份源文件');const file=e.dataTransfer.files[0],item=e.dataTransfer.items?.[0];let hp;try{hp=!BRIDGE&&item?.getAsFileSystemHandle?.();}catch(_){}Promise.resolve(hp).then(async h=>{if(h?.kind==='file'){try{return await loadFile(await h.getFile(),h);}catch(e){toast('无法取得文件权限，将改用普通导入',true);}}await importSelectedSource(file);}).catch(e=>toast(e.message||'文件导入失败',true));}});
window.addEventListener('blur',()=>{clearFileDrop();});
function boot(){let restored=false;try{const data=JSON.parse(localStorage.getItem(STORAGE)||'null');if(data?.project){project=normalizeProject(data.project);sourceName=data.sourceName||'';view=data.view||{type:'board'};zoom=typeof data.zoom==='number'?Math.max(.35,Math.min(1.6,data.zoom)):1;restored=true;}}catch(e){cacheOK=false;}if(!project){project=newProject();dirty=false;}restoredDraft=restored;render();if(restored)restoreHandle();showProjectLibrary();}
window.XuXian=Object.freeze({version:VERSION,snapshot:()=>clone(project)});
boot();
})();
